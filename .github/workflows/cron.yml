name: NutriTrack reminders

# Dispara el endpoint de Vercel cada 5 minutos para enviar los
# recordatorios push de comidas. Vercel (plan Hobby) no permite
# más de 2 invocaciones/día en cron jobs, así que el horario vive aquí.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Llamar a /api/cron/reminders
        run: |
          curl -fsS -H "x-cron-secret: $CRON_SECRET" "$CRON_URL"
          echo "✅ Cron ejecutado"
        env:
          CRON_URL: ${{ secrets.VERCEL_CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
